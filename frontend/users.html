<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - MindSpace</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/app.js?v=2" defer></script>
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <nav class="navbar">
        <a href="index.html" class="logo">🧠 MindSpace</a>
    </nav>

    <div class="container"
        style="flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 2rem;">
        <div class="card" style="width: 100%; max-width: 450px; padding: 2.5rem;">

            <div style="text-align: center; margin-bottom: 2rem;">
                <h2
                    style="font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                    Welcome Back</h2>
                <p class="text-muted">Select your profile to continue to your dashboard.</p>
            </div>

            <div id="users-list"
                style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem;">
                <p class="text-muted text-center" style="font-size: 0.9rem;">Loading profiles...</p>
            </div>

            <div style="position: relative; text-align: center; margin: 2rem 0;">
                <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1);">
                <span
                    style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--bg-dark); padding: 0 10px; color: var(--text-secondary); font-size: 0.85rem;">OR</span>
            </div>

            <div style="text-align: center;">
                <h3 style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--text-secondary);">Create New Profile
                </h3>
                <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
                    <input type="text" id="new-username" placeholder="Enter your name"
                        style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.2); color: var(--text-primary); font-family: 'Inter', sans-serif;">
                </div>
                <button class="primary-btn" onclick="createUser()"
                    style="width: 100%; padding: 0.8rem; font-size: 1rem;">Create Profile</button>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadUsersList();
        });
    </script>

</body>

</html>
