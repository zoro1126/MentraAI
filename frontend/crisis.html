<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crisis Support</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

  <div class="center-page">
    <div class="card" style="border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 40px rgba(239, 68, 68, 0.1);">
      <h1 style="color: var(--danger); background: none; -webkit-text-fill-color: var(--danger);">🚨 Immediate Help</h1>
      <p class="mb-4 text-primary" style="font-size: 1.1rem;">If you are in distress or considering self-harm, please
        contact emergency services immediately.</p>

      <div class="metric-card mb-3" style="text-align: left; background: rgba(239, 68, 68, 0.05);">
        <h3 style="color: #FCA5A5;">US</h3>
        <p style="font-size: 1.5rem; font-weight: bold; color: var(--text-primary);">988 Suicide & Crisis Lifeline</p>
      </div>

      <div class="metric-card" style="text-align: left; background: rgba(239, 68, 68, 0.05);">
        <h3 style="color: #FCA5A5;">India</h3>
        <p style="font-size: 1.5rem; font-weight: bold; color: var(--text-primary);">9152987821 (Kiran Helpline)</p>
      </div>

      <div class="mt-4">
        <a href="index.html" class="secondary-btn">Return Home</a>
      </div>
    </div>
  </div>

</body>

</html>
