<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - MindSpace</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/app.js" defer></script>
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="logo">🧠 MindSpace</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <div class="container" style="max-width: 600px;">
    <h2 class="mb-4">⚙️ Preferences</h2>

    <div class="card">
      <h3 class="mb-3">LLM Configuration</h3>
      <div class="form-group">
        <label>Temperature <span id="temp-val">0.7</span></label>
        <input type="range" min="0" max="1" step="0.1" id="temperature" value="0.7">
      </div>

      <div class="form-group mt-4">
        <label>Max Tokens</label>
        <input type="number" id="maxTokens" value="512">
      </div>

      <button class="primary-btn mt-4">Save Changes</button>
    </div>

  </div>

</body>

</html>
